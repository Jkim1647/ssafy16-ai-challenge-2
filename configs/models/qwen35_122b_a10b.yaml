# Qwen3.5-122B-A10B — MoE, 대형 주력 후보 (담당: 김민우)
name: qwen35_122b_a10b
adapter: qwen35
hf_id: Qwen/Qwen3.5-122B-A10B
family: qwen35

architecture:
  dense: false
  total_params_b: 122
  active_params_b: 10
  layers: 48
  full_attention_layers: 12
  full_attention_interval: 4   # [확인] 2026-09-17 config.json
  hidden_size: 3072
  kv_heads: 2
  head_dim: 256
  experts_total: 256
  experts_active: 9
  expert_intermediate: 1024
