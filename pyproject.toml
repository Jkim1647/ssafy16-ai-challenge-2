[project]
name = "ai2-challenge"
version = "0.1.0"
description = "SSAFY 16기 2회차 AI 챌린지 — 팀 C031_AI챌린저 실험 파이프라인"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    # Qwen3.5(model_type=qwen3_5)는 4.57.6(pypi 최신 정식 릴리스)의 CONFIG_MAPPING에
    # 없다. git main에서 커밋을 고정해 5대 PC가 동일 버전을 쓰게 한다.
    # 정식 릴리스가 qwen3_5를 지원하면 이 핀을 풀고 버전 하한으로 되돌린다.
    "transformers @ git+https://github.com/huggingface/transformers.git@ffddd25146e4225b97a6b5e5b66dd9a823bf39d1",
    "accelerate>=1.15.0",
    "peft>=0.20.0",
    "bitsandbytes>=0.50.0",
    "datasets>=5.0.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3.0.0"]
audit = ["imagehash>=4.3.1", "pyzipper>=0.3.6"]
runpod = ["requests>=2.31.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
ai2 = "src.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.models"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
